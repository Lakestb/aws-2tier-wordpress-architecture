<!-- Dán toàn bộ đoạn này vào 1 khối "Custom HTML" trong trình soạn thảo trang/bài viết WordPress -->
<div id="guestbook-form-wrapper" style="max-width:500px;margin:0 auto;font-family:sans-serif;">
  <h3>Để lại lời nhắn</h3>
  <form id="guestbook-form">
    <div style="margin-bottom:10px;">
      <label>Tên *</label><br>
      <input type="text" id="gb-name" required style="width:100%;padding:8px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:10px;">
      <label>Email (không bắt buộc)</label><br>
      <input type="email" id="gb-email" style="width:100%;padding:8px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:10px;">
      <label>Lời nhắn *</label><br>
      <textarea id="gb-message" required rows="4" style="width:100%;padding:8px;box-sizing:border-box;"></textarea>
    </div>
    <button type="submit" style="padding:10px 20px;">Gửi</button>
    <p id="gb-status" style="margin-top:10px;"></p>
  </form>
</div>

<script>
// THAY URL BÊN DƯỚI bằng Invoke URL thật của API Gateway sau khi deploy (bước 5)
const GUESTBOOK_API_URL = "http://54.179.170.130/index.php/guestbook/";

document.getElementById("guestbook-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const statusEl = document.getElementById("gb-status");
  const submitBtn = e.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  statusEl.textContent = "Đang gửi...";

  const payload = {
    name: document.getElementById("gb-name").value,
    email: document.getElementById("gb-email").value,
    message: document.getElementById("gb-message").value,
  };

  try {
    const res = await fetch(GUESTBOOK_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      statusEl.textContent = "✅ " + data.message;
      e.target.reset();
    } else {
      statusEl.textContent = "❌ " + (data.error || "Có lỗi xảy ra");
    }
  } catch (err) {
    statusEl.textContent = "❌ Không thể kết nối tới máy chủ";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
